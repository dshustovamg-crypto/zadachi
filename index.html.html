<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мои задачи</title>
<meta name="theme-color" content="#0E1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Задачи">
<style>
:root, [data-theme="dark"]{
  --bg:#0E1014; --card:#171A21; --card2:#1C2029; --head:#12151B;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --tx:#E8EAF0; --tx2:#A6ADBB; --tx3:#767E8C;
  --blue:#6E9BFF; --amber:#E3B15C; --violet:#A48BFF; --red:#FF7B70; --green:#5FD08A; --teal:#63C9C0;
  --lateBg:rgba(255,123,112,.07); --rowHover:rgba(255,255,255,.04); --r:14px;
}
[data-theme="light"]{
  --bg:#EEF0F4; --card:#FFFFFF; --card2:#F6F7FA; --head:#F2F4F8;
  --line:rgba(20,25,40,.12); --line2:rgba(20,25,40,.2);
  --tx:#14161A; --tx2:#4E5663; --tx3:#828A96;
  --blue:#2563EB; --amber:#B26B00; --violet:#6B4FD8; --red:#C0392B; --green:#1E7F4F; --teal:#0F766E;
  --lateBg:#FFF4F3; --rowHover:rgba(20,25,40,.035); --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;padding-bottom:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}

.wrap{max-width:1220px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}

/* header */
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.hd .ttl b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hd .sub{font-size:12.5px;color:var(--tx3);margin-bottom:2px}
.hd-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;font-weight:650;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--tx3);white-space:nowrap}
.chip b{color:var(--tx)}
.chip.bad b{color:var(--red)}
.icon{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--tx2)}

/* filters */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:10px;padding:9px 30px 9px 11px;background:var(--card);font-size:13px;font-weight:600;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.search{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);font-size:14px;outline:none}
.btn-add{padding:9px 14px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;white-space:nowrap}
[data-theme="dark"] .btn-add{color:#0B0D11}

/* table */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--head);text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:750;padding:10px 11px;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--tx)}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.38}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--rowHover)}
.tbl tr.late td{background:var(--lateBg)}
.tbl .c-code{font-weight:800;color:var(--tx3);white-space:nowrap;font-size:12px}
.tbl tr.late .c-code{color:var(--red)}
.tbl .c-proj{white-space:nowrap;color:var(--tx2)}
.tbl .c-task{font-weight:600;min-width:210px}
.tbl tr.done .c-task{text-decoration:line-through;color:var(--tx3)}
.tbl .c-who{color:var(--tx2);min-width:110px}
.tbl .c-date{white-space:nowrap;color:var(--tx2);min-width:96px}
.tbl .c-date .late{display:block;color:var(--red);font-weight:700;font-size:10.5px}
.tbl .c-note{color:var(--tx3);font-size:12px;min-width:230px;max-width:420px}
.tbl .c-note div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbl .stsel{border:0;border-radius:999px;padding:4px 8px;font-size:10.5px;font-weight:750;color:#fff;appearance:none;-webkit-appearance:none;cursor:pointer;max-width:130px}
.arrow{color:var(--blue);font-weight:800}

/* cards (mobile) */
.cards{display:none}
.task{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 46px 12px 14px;margin-bottom:9px}
.task .row1{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.code{font-size:11px;font-weight:800;color:var(--tx3)}
.pill{font-size:10.5px;font-weight:750;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.red{background:rgba(255,123,112,.16);color:var(--red)}
.pill.blue{background:rgba(110,155,255,.16);color:var(--blue)}
.pill.amber{background:rgba(227,177,92,.16);color:var(--amber)}
.pill.violet{background:rgba(164,139,255,.16);color:var(--violet)}
.pill.gray{background:rgba(128,128,128,.14);color:var(--tx2)}
.pill.green{background:rgba(95,208,138,.16);color:var(--green)}
.pill.brown{background:rgba(162,132,94,.2);color:#C9A87C}
.task .tt{font-size:14.5px;font-weight:650;line-height:1.3}
.task .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px;font-size:11.5px;color:var(--tx3)}
.task .meta b{color:var(--tx2);font-weight:600}
.dot{width:3px;height:3px;border-radius:50%;background:var(--tx3);display:inline-block}
.task .chk{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line2);display:grid;place-items:center}
.task .chk svg{width:13px;height:13px;opacity:0;color:#0B0D11}
.task.done{opacity:.55}
.task.done .tt{text-decoration:line-through}
.task.done .chk{background:rgba(95,208,138,.4);border-color:rgba(95,208,138,.6)}
.task.done .chk svg{opacity:1}
.task.late{border-color:rgba(255,123,112,.3);background:var(--lateBg)}
.task.today{border-color:rgba(110,155,255,.3)}
.star{color:var(--amber);font-size:13px}

/* calendar */
.daybar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 10px}
.daybar .nav{display:flex;gap:5px}
.daybar button{width:32px;height:32px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--tx2)}
.daybar b{font-size:15px}
.free{font-size:11px;color:var(--green);background:rgba(95,208,138,.1);padding:5px 9px;border-radius:999px;font-weight:650}
.filters .fchip{padding:7px 11px;border-radius:999px;font-size:11.5px;font-weight:650;color:var(--tx2);background:var(--card);border:1px solid var(--line)}
.fchip.on{background:var(--card2);color:var(--tx);border-color:var(--line2)}
.fchip .d{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tl{position:relative;margin:0 0 6px;padding-left:44px}
.tl .hline{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.tl .hl{position:absolute;left:0;font-size:9.5px;color:var(--tx3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.ev{position:absolute;left:44px;right:0;border-radius:8px;padding:5px 7px;font-size:11.5px;line-height:1.2;border-left:3px solid var(--blue);background:rgba(110,155,255,.14);overflow:hidden}
.ev.src-icl{border-left-color:var(--violet);background:rgba(164,139,255,.14)}
.ev.src-man{border-left-color:var(--teal);background:rgba(99,201,192,.14)}
.ev b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{font-style:normal;font-size:9px;color:var(--tx3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:44px;right:0;border-top:1px dashed rgba(255,123,112,.7)}
.windows{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.windows span{font-size:10.5px;padding:5px 8px;border-radius:7px;background:rgba(95,208,138,.1);color:var(--green);border:1px solid rgba(95,208,138,.18)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.day{border-radius:10px;padding:6px 3px 7px;text-align:center;background:var(--card);border:1px solid var(--line)}
.day.on{background:rgba(110,155,255,.14);border-color:rgba(110,155,255,.35)}
.day .wd{font-size:8.5px;color:var(--tx3);text-transform:uppercase}
.day .dn{font-size:13px;font-weight:700;margin:1px 0 3px}
.dots{display:flex;gap:2px;justify-content:center;min-height:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--blue)}
.dots i.v{background:var(--violet)} .dots i.m{background:var(--teal)}
.meet{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.meet .bar{width:3px;border-radius:99px;background:var(--blue);flex:0 0 3px}
.meet.src-icl .bar{background:var(--violet)}
.meet.src-man .bar{background:var(--teal)}
.meet .tm{width:44px;flex:0 0 auto;font-size:12px;font-weight:750;color:var(--tx2)}
.meet .bd b{font-size:13.5px;font-weight:650;display:block}
.meet .bd span{display:block;font-size:11px;color:var(--tx3);margin-top:2px}
.src{font-size:9.5px;font-weight:750;padding:2px 6px;border-radius:5px}
.src.bx{background:rgba(110,155,255,.16);color:var(--blue)}
.src.icl{background:rgba(164,139,255,.16);color:var(--violet)}
.src.man{background:rgba(99,201,192,.16);color:var(--teal)}
.topic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px}
.topic .th{display:flex;justify-content:space-between;gap:8px}
.topic .th b{font-size:14px}
.topic .pct{font-weight:800;color:var(--blue);font-size:13px}
.bar{height:5px;border-radius:99px;background:rgba(128,128,128,.2);margin:9px 0 7px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6E9BFF,#9C7BFF)}
.topic .tf{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--tx3)}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;margin:4px 0}
.msg{max-width:86%;padding:10px 12px;border-radius:15px;font-size:13.5px;line-height:1.4;white-space:pre-wrap}
.msg.bot{background:var(--card);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.sugg{display:flex;gap:5px;overflow-x:auto;padding:8px 0}
.sugg button{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.quick{display:flex;gap:7px;margin-top:10px}
.quick input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);outline:none;font-size:14px}
.quick .add{width:44px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px}
[data-theme="dark"] .quick .add{color:#0B0D11}

/* tabs */
.tabbar{position:sticky;top:0;z-index:45;display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;color:var(--tx3);font-size:12.5px;font-weight:650;white-space:nowrap}
.tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue);background:var(--card2)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 15px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 10px}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;font-weight:750;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px 2px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--card);outline:none;font-size:15px}
.field textarea{min-height:58px;resize:vertical}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.statuses{display:flex;flex-wrap:wrap;gap:5px}
.st{font-size:11.5px;font-weight:700;padding:7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--tx2)}
.st.on{color:#fff}
[data-theme="dark"] .st.on{color:#0B0D11}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;display:block;width:100%}
.btn.primary{background:var(--blue);color:#fff}
[data-theme="dark"] .btn.primary{color:#0B0D11}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--tx)}
.btn.danger{background:rgba(255,123,112,.14);color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--card2);color:var(--tx);padding:10px 15px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:.2s;border:1px solid var(--line2);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:18px;text-align:center;color:var(--tx3);font-size:13px}

@media (max-width:820px){
  .tblwrap{display:none}
  .cards{display:block}
  .hd{flex-direction:column}
  .hd-actions{justify-content:flex-start}
}
</style>
</head>

<script>
var LS='mz.v4', START_H=8, END_H=18, PXH=46;
var STATUSES=[
 {id:'clarify',n:'Уточнить',c:'#8E8E93'},{id:'todo',n:'Не начато',c:'#2563EB'},
 {id:'doing',n:'В работе',c:'#C9821E'},{id:'waiting',n:'Ожидаем ответ',c:'#6B4FD8'},
 {id:'blocked',n:'Заблокировано',c:'#C0392B'},{id:'postponed',n:'Отложено',c:'#8C6D46'},
 {id:'done',n:'Выполнено',c:'#1E7F4F'}
];
function st(id){for(var i=0;i<STATUSES.length;i++)if(STATUSES[i].id===id)return STATUSES[i];return STATUSES[1];}
function isDone(t){return t.status==='done';}
var SRC={bx:{n:'Битрикс',cls:'bx'},icl:{n:'iPhone',cls:'icl'},man:{n:'Вручную',cls:'man'}};
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHS_S=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var WD_FULL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function pad(n){return String(n).length<2?'0'+n:''+n;}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();}
function isoDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return isoDate(new Date());}
function parseISO(s){var p=String(s||'').split('-').map(Number);return new Date(p[0]||1970,(p[1]||1)-1,p[2]||1);}
function addDaysISO(base,n){var d=new Date(base.getFullYear(),base.getMonth(),base.getDate());d.setDate(d.getDate()+n);return isoDate(d);}
function shiftISO(n){var d=new Date();d.setDate(d.getDate()+n);return isoDate(d);}
function startOfWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function fmtS(s){if(!s)return'';var d=parseISO(s);return d.getDate()+' '+MONTHS_S[d.getMonth()];}
function fmtFull(s){if(!s)return'';var d=parseISO(s);return WD_FULL[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];}
function human(s){if(!s)return'без срока';if(s===todayISO())return'сегодня';if(s===shiftISO(1))return'завтра';if(s===shiftISO(-1))return'вчера';return fmtS(s);}
function daysLate(t){if(!t.date)return 0;var d=Math.round((parseISO(todayISO())-parseISO(t.date))/86400000);return d>0?d:0;}
function minOf(v){var p=String(v||'00:00').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function hhmm(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60);}
function dtShort(iso){if(!iso)return'—';var d=parseISO(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();}

function blank(){return{projects:[],tasks:[],events:[],chat:[],settings:{}};}
function seed(){
 var s=blank();
 s.projects.push({id:'p01',code:'П-01',name:'Защита информации и регулирование фото- и видеосъёмки',goal:'Выстроить правомерную систему ограничений съёмки и порядок реагирования на нарушения'});
 var rows=[

/* ---- синхронизация через GitHub ---- */
var ghTimer=null, ghSha=null, ghLast='', ghToken=(function(){try{return localStorage.getItem(LS+'.token')||'';}catch(e){return '';}})();
function ghCfg(){
 var s=state.settings.gh||{};
 return (s.owner&&s.repo&&ghToken)?{owner:s.owner,repo:s.repo,path:s.path||'data.json',token:ghToken}:null;
}
function ghHdr(){return {'Authorization':'Bearer '+ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'};}
function ghUrl(c){return 'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+c.path;}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
function ghStatus(t){var el=document.getElementById('ghStatus');if(el)el.textContent=t;}

function save(){
 try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
 if(ghCfg()) ghPush();
}
function ghLoad(){
 var c=ghCfg();if(!c)return;
 ghStatus('Соединяюсь…');
 fetch(ghUrl(c),{headers:ghHdr()}).then(function(r){
  if(r.status===404){ghSha=null;ghLast='';ghPush();return null;}
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
 }).then(function(j){
  if(!j)return;
  ghSha=j.sha;
  var txt=b64d(j.content);ghLast=txt;
  try{
   var remote=JSON.parse(txt);
   if(remote&&remote.tasks){state=migrate(remote);render();ghStatus('Синхронизировано');}
  }catch(e){}
 }).catch(function(e){ghStatus('Ошибка: '+e.message);});
}
function ghPush(){
 var c=ghCfg();if(!c)return;
 clearTimeout(ghTimer);
 ghTimer=setTimeout(function(){
  var txt=JSON.stringify(state);
  if(txt===ghLast){ghStatus('Синхронизировано');return;}
  var body={message:'sync '+new Date().toISOString(),content:b64e(txt)};
  if(ghSha)body.sha=ghSha;
  fetch(ghUrl(c),{method:'PUT',headers:ghHdr(),body:JSON.stringify(body)})
   .then(function(r){
    if(r.status===409){
     return fetch(ghUrl(c),{headers:ghHdr()}).then(function(x){return x.json();}).then(function(j){
      if(j&&j.sha){ghSha=j.sha;body.sha=j.sha;}
      return fetch(ghUrl(c),{method:'PUT',headers:ghHdr(),body:JSON.stringify(body)});
     });
    }
    return r;
   })
   .then(function(r){if(r&&r.ok)return r.json();throw new Error('HTTP '+(r?r.status:'нет ответа'));})
   .then(function(j){if(j&&j.content)ghSha=j.content.sha;ghLast=txt;ghStatus('Синхронизировано '+new Date().toLocaleTimeString());})
   .catch(function(e){ghStatus('Не сохранилось: '+e.message);});
 },1200);
}

function freeWindows(d,from,to){
 from=from==null?START_H*60:from;to=to==null?END_H*60:to;
 var evs=eventsOn(d).slice().sort(function(a,b){return minOf(a.start)-minOf(b.start);});var out=[],cur=from;
 for(var i=0;i<evs.length;i++){var s=Math.max(from,minOf(evs[i].start)),e=Math.min(to,minOf(evs[i].end));if(e<=from||s>=to)continue;if(s>cur)out.push([cur,s]);if(e>cur)cur=e;}
 if(cur<to)out.push([cur,to]);return out;
}

/* ---- разбор фраз ---- */
function extractWhen(text){
 var t=' '+String(text)+' ',date=null,time=null,NB='[^\\p{L}\\p{N}]';
 function take(body){var re=new RegExp('(^|'+NB+')'+body+'(?='+NB+'|$)','iu');var m=t.match(re);if(!m)return null;t=t.replace(re,'$1 ');return m;}
 var wdF={'понедельник':1,'вторник':2,'среда':3,'среду':3,'четверг':4,'пятница':5,'пятницу':5,'суббота':6,'субботу':6,'воскресенье':0};
 var wdS={'пн':1,'вт':2,'ср':3,'чт':4,'пт':5,'сб':6,'вс':0};
 if(take('послезавтра'))date=shiftISO(2);else if(take('завтра'))date=shiftISO(1);else if(take('сегодня'))date=todayISO();
 if(!date){var m=take('через\\s+(\\d+)\\s*(день|дня|дней|недел\\p{L}*|месяц\\p{L}*)');if(m){var n=parseInt(m[2],10),u=norm(m[3]);date=u.indexOf('недел')===0?shiftISO(n*7):u.indexOf('месяц')===0?shiftISO(n*30):shiftISO(n);}}
 if(!date){var m2=take('(понедельник|вторник|сред[ау]|четверг|пятниц[ау]|суббот[ау]|воскресень[ея]|пн|вт|ср|чт|пт|сб|вс)');if(m2){var k=norm(m2[2]),tg=(k in wdF)?wdF[k]:wdS[k],cur=new Date(),df=(tg-cur.getDay()+7)%7;if(df===0)df=7;date=addDaysISO(cur,df);}}
 if(!date){var m3=take('(\\d{1,2})[./](\\d{1,2})(?:[./](\\d{2,4}))?');if(m3){var y=m3[4]?parseInt(m3[4],10):new Date().getFullYear();if(y<100)y+=2000;date=isoDate(new Date(y,parseInt(m3[3],10)-1,parseInt(m3[2],10)));}}
 var mt=take('(?:в|к)\\s+(\\d{1,2})[:.](\\d{2})');if(!mt)mt=take('(?:в|к)\\s+(\\d{1,2})(?:\\s*час\\p{L}*)?');
 if(mt){var h=parseInt(mt[2],10),mi=mt[3]?parseInt(mt[3],10):0;if(h>=0&&h<=23&&mi>=0&&mi<=59)time=pad(h)+':'+pad(mi);}
 return {date:date,time:time,rest:t.replace(/\s+/g,' ').trim()};
}
function createTask(raw){

 var text=w.rest.replace(/^(добавь|добавить|создай|создать|запиши|записать|напомни|новая задача)\s+/i,'').replace(/\s+/g,' ').trim();
 if(!text)return null;
 var t={id:uid(),code:'Т-'+pad(state.tasks.length+1),title:text,date:w.date||'',time:w.time||'',status:w.date?'todo':'clarify',projectId:state.projects[0]?state.projects[0].id:null,assignee:'',note:'',important:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
 state.tasks.push(t);touch();save();return t;
}

 if(ui.status==='open')arr=arr.filter(function(t){return !isDone(t);});
 else if(ui.status!=='all')arr=arr.filter(function(t){return t.status===ui.status;});
 if(ui.q)arr=arr.filter(function(t){return norm(t.title+' '+t.note+' '+t.assignee+' '+t.code).indexOf(norm(ui.q))>=0;});
 var key=ui.sort?ui.sort.key:'',dir=ui.sort?ui.sort.dir:1;
 var codeNum=function(t){var n=parseInt(String(t.code).replace(/\D/g,''),10);return isNaN(n)?999:n;};
 arr.sort(function(a,b){
  if(isDone(a)!==isDone(b))return isDone(a)?1:-1;
  if(!key){var ao=a.date&&a.date<todayISO()?0:1,bo=b.date&&b.date<todayISO()?0:1;if(ao!==bo)return ao-bo;var ad=a.date||'9999',bd=b.date||'9999';return ad.localeCompare(bd)||codeNum(a)-codeNum(b);}
  var r=0;
  if(key==='code')r=codeNum(a)-codeNum(b);

  else if(key==='status')r=STATUSES.findIndex(function(z){return z.id===a.status;})-STATUSES.findIndex(function(z){return z.id===b.status;});
  return r!==0?r*dir:codeNum(a)-codeNum(b);
 });
 return arr;

function timelineHTML(d){
 var evs=visibleEvents(d),h=(END_H-START_H)*PXH,out='<div class="tl" style="height:'+h+'px">';
 for(var hh=START_H;hh<=END_H;hh++){var top=(hh-START_H)*PXH;out+='<div class="hline" style="top:'+top+'px"></div><div class="hl" style="top:'+top+'px">'+pad(hh)+':00</div>';}
 for(var i=0;i<evs.length;i++){var e=evs[i],s=Math.max(START_H*60,minOf(e.start)),en=Math.min(END_H*60,minOf(e.end));if(en<=s)continue;
  var t2=(s-START_H*60)/60*PXH,hg=Math.max(22,(en-s)/60*PXH-2),src=SRC[e.source]||SRC.man;
  out+='<div class="ev src-'+src.cls+'" style="top:'+t2+'px;height:'+hg+'px" data-action="open-event" data-id="'+e.id+'"><b>'+esc(e.title)+'</b><i>'+esc(e.start+'–'+e.end+(e.place?' · '+e.place:''))+'</i></div>';}
 if(d===todayISO()){var now=new Date(),mn=now.getHours()*60+now.getMinutes();if(mn>=START_H*60&&mn<=END_H*60)out+='<div class="now" style="top:'+((mn-START_H*60)/60*PXH)+'px"></div>';}
 return out+'</div>';
}
function weekStrip(anchor,sel){

 for(var i=0;i<7;i++){var dd=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()+i),key=isoDate(dd);

  for(var j=0;j<evs.length&&j<4;j++)dots+='<i class="'+(evs[j].source==='icl'?'v':evs[j].source==='man'?'m':'')+'"></i>';
  out+='<div class="day'+(key===sel?' on':'')+'" data-action="pick-day" data-date="'+key+'"><div class="wd">'+WD[dd.getDay()]+'</div><div class="dn">'+dd.getDate()+'</div><div class="dots">'+dots+'</div></div>';}
 return out+'</div>';

function setStatus(sel){
 var t=state.tasks.filter(function(x){return x.id===sel.getAttribute('data-id');})[0];if(!t)return;
 t.status=sel.value;t.updatedAt=new Date().toISOString();touch();save();render();
}
function toggleTask(id){
 var t=state.tasks.filter(function(x){return x.id===id;})[0];if(!t)return;
 t.status=isDone(t)?'todo':'done';t.updatedAt=new Date().toISOString();touch();save();render();
}
function sendChat(){
 var inp=document.getElementById('chatInput');if(!inp)return;var v=inp.value.trim();if(!v)return;
 inp.value='';pushChat('me',v);pushChat('bot',reply(v));render();
}
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter')return;
 if(e.target.id==='chatInput'){e.preventDefault();sendChat();}
});
function exportData(){
 var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='moi-zadachi-'+todayISO()+'.json';a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);},2000);toast('Файл сохранён');
}
function importData(){
 var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{state=migrate(JSON.parse(String(r.result)));save();closeSheet();render();toast('Данные загружены');}catch(err){toast('Не удалось прочитать файл');}};
  r.readAsText(f);};
 inp.click();
}
var toastTimer=null;
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2200);}

render();
if(ghCfg()) ghLoad();
</script>
</body>
</html>
